name: Feature request
description: Suggest a focused senior-dog care handoff improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: scenario
    attributes:
      label: Care handoff scenario
      description: Describe the caregiver situation this would improve.
      placeholder: "Example: A boarding caregiver needs two medication reminders with different missed-dose rules."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
